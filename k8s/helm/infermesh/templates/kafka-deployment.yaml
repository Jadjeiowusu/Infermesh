apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kafka
  labels:
    app: infermesh-kafka
spec:
  # Same caveat as zookeeper-deployment.yaml: single replica, no PVC,
  # demo-scoped only.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: infermesh-kafka
  template:
    metadata:
      labels:
        app: infermesh-kafka
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_BROKER_ID
              value: "1"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "{{ .Release.Name }}-zookeeper:2181"
            # Advertised listener MUST be the in-cluster Service DNS name,
            # not localhost — this is what gateway/consumer pods resolve
            # to reach Kafka. Getting this wrong (e.g. leaving it as
            # localhost, which works fine in docker-compose on a single
            # host) is a classic "works in docker-compose, breaks in k8s"
            # gotcha.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://{{ .Release.Name }}-kafka:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            # Cap JVM heap explicitly — Kafka's default heap sizing can
            # be aggressive relative to a local minikube node's memory
            # budget, especially alongside everything else running on the
            # same laptop.
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx512M -Xms512M"
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
