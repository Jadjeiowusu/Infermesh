{{- if .Values.gateway.canary.enabled }}
# Basic label-based canary: this Deployment's pods share the exact same
# "app: infermesh-gateway" label as the main gateway-deployment.yaml, so
# gateway-service.yaml's selector routes to both — traffic split is
# roughly (canary replicas) / (total replicas), not a precise weighted
# percentage. This is the honest, vanilla-Kubernetes version of a canary;
# a real weighted/progressive rollout (exact percentages, automated
# rollback on error-rate regression) needs a tool like Argo Rollouts or
# Flagger, which is out of scope here — noted rather than pretended away.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway-canary
  labels:
    app: infermesh-gateway
    track: canary
spec:
  replicas: {{ .Values.gateway.canary.replicaCount }}
  selector:
    matchLabels:
      app: infermesh-gateway
      track: canary
  template:
    metadata:
      labels:
        app: infermesh-gateway
        track: canary
    spec:
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.canary.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 8000
          env:
            {{- range $key, $value := .Values.gateway.env }}
            {{- if ne $key "KAFKA_BOOTSTRAP_SERVERS" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "{{ .Release.Name }}-kafka:9092"
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
{{- end }}
