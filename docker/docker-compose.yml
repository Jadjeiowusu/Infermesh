version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on: [zookeeper]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      MODEL_BACKEND: mock
      N_MOCK_REPLICAS: "2"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"

  metrics-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.consumer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CONSUMER_METRICS_PORT: "9100"
    ports:
      - "9100:9100"

  event-archiver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.archiver
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ARCHIVER_METRICS_PORT: "9101"
    ports:
      - "9101:9101"
    volumes:
      # Named volume, not a bind mount — the archive log survives
      # container restarts/rebuilds but isn't tied to a specific host
      # path. Inspect it with: docker compose exec event-archiver cat
      # /data/archived_events.jsonl
      - archive-data:/data

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../observability/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    depends_on: [gateway, metrics-consumer, event-archiver]

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ../observability/grafana-dashboards:/var/lib/grafana/dashboards
      - ../observability/grafana-provisioning:/etc/grafana/provisioning
    depends_on: [prometheus]

  streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile.streamlit
    environment:
      GATEWAY_URL: http://gateway:8000
    ports:
      - "8501:8501"
    depends_on: [gateway]

volumes:
  archive-data:
