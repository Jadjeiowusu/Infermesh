global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "infermesh-gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics/

  - job_name: "infermesh-metrics-consumer"
    static_configs:
      - targets: ["metrics-consumer:9100"]

  - job_name: "infermesh-event-archiver"
    static_configs:
      - targets: ["event-archiver:9101"]
